services:
  database:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    container_name: qianshilin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qianshilin
      POSTGRES_USER: qianshilin
      POSTGRES_PASSWORD: ${QIANSHILIN_DB_PASSWORD:?Set QIANSHILIN_DB_PASSWORD}
    volumes:
      - qianshilin_pgdata:/var/lib/postgresql/data
      - ./apps/api/db/migrations/001_identity.sql:/docker-entrypoint-initdb.d/001_identity.sql:ro
      - ./apps/api/db/seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
      - ./apps/api/db/migrations/002_reference_catalog.sql:/docker-entrypoint-initdb.d/003_reference_catalog.sql:ro
      - ./apps/api/db/migrations/003_catalog_access.sql:/docker-entrypoint-initdb.d/004_catalog_access.sql:ro
      - ./apps/api/db/migrations/004_purchase_orders.sql:/docker-entrypoint-initdb.d/005_purchase_orders.sql:ro
      - ./apps/api/db/migrations/005_manual_inbound.sql:/docker-entrypoint-initdb.d/006_manual_inbound.sql:ro
      - ./apps/api/db/migrations/006_rbac.sql:/docker-entrypoint-initdb.d/007_rbac.sql:ro
      - ./apps/api/db/migrations/007_rbac_seed.sql:/docker-entrypoint-initdb.d/008_rbac_seed.sql:ro
      - ./apps/api/db/migrations/008_operation_log.sql:/docker-entrypoint-initdb.d/009_operation_log.sql:ro
      - ./apps/api/db/migrations/009_operation_log_role.sql:/docker-entrypoint-initdb.d/010_operation_log_role.sql:ro
      - ./apps/api/db/migrations/010_menu_copy.sql:/docker-entrypoint-initdb.d/011_menu_copy.sql:ro
      - ./apps/api/db/migrations/015_staff_profiles.sql:/docker-entrypoint-initdb.d/015_staff_profiles.sql:ro
      - ./apps/api/db/migrations/014_customer_details.sql:/docker-entrypoint-initdb.d/014_customer_details.sql:ro
      - ./apps/api/db/migrations/011_internal_notices.sql:/docker-entrypoint-initdb.d/012_internal_notices.sql:ro
      - ./apps/api/db/migrations/021_session_idle_timeout.sql:/docker-entrypoint-initdb.d/021_session_idle_timeout.sql:ro
      - ./apps/api/db/migrations/022_service_pricing.sql:/docker-entrypoint-initdb.d/022_service_pricing.sql:ro
      - ./apps/api/db/migrations/023_store_master.sql:/docker-entrypoint-initdb.d/023_store_master.sql:ro
      - ./apps/api/db/migrations/024_password_policy.sql:/docker-entrypoint-initdb.d/024_password_policy.sql:ro
      - ./apps/api/db/migrations/025_staff_created_at.sql:/docker-entrypoint-initdb.d/025_staff_created_at.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qianshilin -d qianshilin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
  api:
    build: ./apps/api
    image: ${QIANSHILIN_API_IMAGE:-qianshilin-api:local}
    container_name: qianshilin-api
    restart: unless-stopped
    environment:
      QSL_REFRESH_GEOFEED: "1"
      DATABASE_URL: postgresql://qianshilin:${QIANSHILIN_DB_PASSWORD}@database:5432/qianshilin
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
      - proxy
  qianshilin:
    image: ${QIANSHILIN_IMAGE:?Set QIANSHILIN_IMAGE}
    container_name: qianshilin
    restart: unless-stopped
    networks:
      - proxy
networks:
  proxy:
    external: true
  internal:
    internal: true
volumes:
  qianshilin_pgdata:
